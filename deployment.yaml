apiVersion: apps/v1
kind: Deployment
metadata:
  name: q3-department-portal
  labels:
    app: q3-department-portal

spec:
  replicas: 3

  selector:
    matchLabels:
      app: q3-department-portal

  template:
    metadata:
      labels:
        app: q3-department-portal

    spec:
      containers:
        - name: q3-department-portal
          image: raeezsafa9778/q3-department-portal:latest
          ports:
            - containerPort: 80
          imagePullPolicy: Always

---
apiVersion: v1
kind: Service
metadata:
  name: q3-department-portal-service

spec:
  type: NodePort

  selector:
    app: q3-department-portal

  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30021
